name: Weekly RegSignal run

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC = 08:30 IST
  workflow_dispatch:
    inputs:
      send_email:
        description: "Email subscribers after this run"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: regsignal-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the engine
        run: npm test
      - name: Read all 17 regulators
        id: run
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          SEND_EMAIL: ${{ github.event_name == 'schedule' && 'true' || inputs.send_email }}
        run: node engine/run.mjs
      - name: Publish the results
        run: |
          git config user.name "regsignal-bot"
          git config user.email "regsignal-bot@users.noreply.github.com"
          git add data feed.xml
          git diff --cached --quiet || git commit -m "Weekly run $(date -u +%F): ${{ steps.run.outputs.new_count }} new, ${{ steps.run.outputs.revised_count }} revised"
          git push
